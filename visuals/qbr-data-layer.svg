<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif">
  <title>QBR data layer: sources to unified SQL layer to Copilot agent to QBR deck</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c8781"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#1b1b1d"/>

  <!-- Header -->
  <text x="90" y="110" font-size="14" font-weight="600" letter-spacing="2" fill="#ff6b1a">VEEAM INTERNSHIP</text>
  <text x="90" y="156" font-size="36" font-weight="600" fill="#f5f1ec">QBR Data Layer</text>

  <!-- Flow -->
  <g font-size="19" font-weight="500" text-anchor="middle">
    <rect x="90" y="290" width="210" height="76" rx="10" fill="#232326" stroke="#34343a" stroke-width="1.5"/>
    <text x="195" y="324" fill="#d8d4ce">Lakehouse +</text>
    <text x="195" y="348" fill="#d8d4ce">ServiceNow</text>

    <text x="465" y="272" font-size="12" font-weight="600" letter-spacing="1.5" fill="#ff6b1a">MY BUILD</text>
    <rect x="360" y="290" width="210" height="76" rx="10" fill="#232326" stroke="#ff6b1a" stroke-width="2"/>
    <text x="465" y="335" font-weight="600" fill="#f5f1ec">Unified SQL layer</text>

    <rect x="630" y="290" width="210" height="76" rx="10" fill="none" stroke="#8c8781" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="735" y="335" fill="#d8d4ce">Copilot agent</text>
    <text x="735" y="392" font-size="12" font-weight="600" letter-spacing="1.5" fill="#8c8781">CONFIDENTIAL</text>

    <rect x="900" y="290" width="210" height="76" rx="10" fill="#232326" stroke="#34343a" stroke-width="1.5"/>
    <text x="1005" y="335" fill="#d8d4ce">QBR deck</text>
  </g>
  <g stroke="#8c8781" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="306" y1="328" x2="352" y2="328"/>
    <line x1="576" y1="328" x2="622" y2="328"/>
    <line x1="846" y1="328" x2="892" y2="328"/>
  </g>

  <!-- Stats -->
  <text x="90" y="540" font-size="34" font-weight="600" fill="#ff6b1a">500+</text>
  <text x="90" y="570" font-size="15" fill="#8c8781">employees using it</text>
  <text x="420" y="540" font-size="34" font-weight="600" fill="#ff6b1a">1 week → on demand</text>
  <text x="420" y="570" font-size="15" fill="#8c8781">QBR prep per account (was up to a week)</text>
</svg>
